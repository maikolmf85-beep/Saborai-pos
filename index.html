    <!-- ═══ Structured Data — FAQPage ════════════════════════════════════ -->

    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Saborai POS cumple con la facturación electrónica de Hacienda Costa Rica?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Saborai POS emite facturas electrónicas en formato XML según la normativa del Ministerio de Hacienda de Costa Rica versión 4.3, con clave de 50 dígitos y control de IVA diferenciado (13%, 4%, 2%, 1% y exento)."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo funcionan los pagos con Tilopay en Saborai POS?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Saborai POS integra Tilopay para cobros con tarjetas de crédito y débito en Costa Rica. Los datos de tarjeta son tokenizados de forma segura y los cobros de suscripción son automáticos cada mes."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo usar Saborai POS sin conexión a Internet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Saborai POS funciona en modo Offline mediante sincronización en red local (Mesh) con IndexedDB y WebSockets locales. Tus operaciones continúan con normalidad y se sincronizan al recuperar la conexión."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto cuesta Saborai POS en Costa Rica?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Saborai POS tiene 3 planes: Plan Express ₡22,000/mes, Plan Pro ₡45,000/mes y Plan Multi-Sucursal ₡85,000/mes por sucursal. Todos incluyen prueba gratuita de 14 días."
          }
        }
      ]
    }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sageBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4c69e" />
      <stop offset="100%" stop-color="#8ea375" />
    </linearGradient>
    <clipPath id="badgeClip">
      <rect x="10" y="10" width="100" height="100" rx="30" />
    </clipPath>
  </defs>

  <!-- Left Icon Badge -->
  <g clip-path="url(#badgeClip)">

    <tspan fill="#9ab084" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="64" dx="0" dy="2">s</tspan><tspan fill="#3b3733" dx="2" dy="-2">aboraí</tspan>
    <tspan fill="#3b3733" dx="10">po</tspan><tspan fill="#9ab084" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="64" dx="2" dy="2">s</tspan>
  </text>
</svg>

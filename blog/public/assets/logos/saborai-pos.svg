    <path d="M10 110L110 10V110H10Z" fill="#3b3733" />
    <path d="M25 105C48 105 58 80 58 60C58 40 68 15 105 15" stroke="#fcfeff" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- Typography saboraí pos -->
